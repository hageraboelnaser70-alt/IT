<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | BookStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <nav>
            <a href="index.html" class="logo">Book<span>Store</span></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="help.html">Help</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    </header>
    <main class="contact-container">
        <form id="contact-form" class="contact-form">
            <h1>Contact Us</h1>
            <p>We would love to hear from you!</p>
            <label for="contact-name">Name</label>
            <input type="text" id="contact-name" name="name" placeholder="Enter your name" required>
            <label for="contact-email">Email</label>
            <input type="email" id="contact-email" name="email" placeholder="Enter your email" required>
            <label for="contact-phone">Phone</label>
            <input type="tel" id="contact-phone" name="phone" placeholder="Enter your phone number" required>
            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" rows="5" placeholder="Write your message here"
                required></textarea>
            <button type="submit" class="btn-details">
                Submit
            </button>
            <p id="contact-status" class="contact-status" role="status"></p>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Bookstore. All rights reserved.</p>
    </footer>
    <script>
        const contactForm = document.getElementById("contact-form");
        contactForm.addEventListener("submit", function (event) {
            event.preventDefault();
            const message = {
                name: document.getElementById("contact-name").value.trim(),
                email: document.getElementById("contact-email").value.trim(),
                phone: document.getElementById("contact-phone").value.trim(),
                message: document.getElementById("contact-message").value.trim()
            };
            if (!message.name || !message.email ||
                !message.phone || !message.message) {
                alert("Please complete all fields.");
                return;
            }
            document.getElementById("contact-status").textContent =
                "Thank you! Your message was received in this demo.";
            contactForm.reset();
        });
    </script>
</body>

</html>
