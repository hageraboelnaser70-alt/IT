<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | BookStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <nav>
            <a href="index.html" class="logo">Book<span>Store</span></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="help.html">Help</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    </header>
    <main class="account-container">
        <form id="signup-form" class="account-form">
            <h1>Create Account</h1>
            <p>Create your account to continue shopping!</p>
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" minlength="6"
                required>
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password"
                minlength="6" required>
            <button type="submit" class="btn-details">
                Submit
            </button>
            <p class="account-link">
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Bookstore. All rights reserved.</p>
    </footer>
    <script>
        const signupForm = document.getElementById("signup-form");
        signupForm.addEventListener("submit", function (event) {
            event.preventDefault();
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirm-password").value;
            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }
            // Save demo account information for this browser session.
            // This is a frontend demonstration, not real authentication.
            sessionStorage.setItem("signupName", name);
            sessionStorage.setItem("signupEmail", email);
            sessionStorage.setItem("signupPassword", password);
            alert("Account created successfully!");
            window.location.href = "login.html";
        });
    </script>
</body>

</html>
