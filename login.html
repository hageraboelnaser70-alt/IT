<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BookStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <nav>
            <a href="index.html" class="logo">Book<span>Store</span></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="help.html">Help</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    </header>
    <main class="account-container">
        <form id="login-form" class="account-form">
            <h1>Welcome Back!</h1>
            <p>Login to continue your purchase.</p>
            <label for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="Enter your email" required>
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="Enter your password" required>
            <button type="submit" class="btn-details">
                Submit
            </button>
            <p class="account-link">
                Don't have an account?
                <a href="create-account.html">Create Account</a>
            </p>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Bookstore. All rights reserved.</p>
    </footer>
    <script>
        const loginForm = document.getElementById("login-form");
        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();
            const email =
                document.getElementById("login-email").value.trim();
            const password =
                document.getElementById("login-password").value;
            const savedEmail = sessionStorage.getItem("signupEmail");
            const savedPassword = sessionStorage.getItem("signupPassword");
            if (!savedEmail || !savedPassword) {
                alert("Please create an account first!");
                window.location.href = "create-account.html";
                return;
            }
            if (email !== savedEmail || password !== savedPassword) {
                alert("Incorrect email or password!");
                return;
            }
            alert("Login successful!");
            window.location.href = "purchase-review.html";
        });
    </script>
</body>

</html>
